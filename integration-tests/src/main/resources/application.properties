quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=postgres:16.10
quarkus.datasource.devservices.reuse=false
quarkus.datasource.jdbc.transaction-isolation-level=read-committed
quarkus.datasource.jdbc.min-size=0
quarkus.datasource.jdbc.max-size=2
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.statistics=true
quarkus.hibernate-orm.second-level-caching-enabled=true
ru.code4a.transactional-rw.hibernate.enabled=true
ru.code4a.transactional-rw.serializable.enabled=true
ru.code4a.transactional-rw.serializable.auto-retry.enabled=true
ru.code4a.transactional-rw.serializable.auto-retry.max-attempts=3
ru.code4a.transactional-rw.serializable.auto-retry.delay-ms=0
